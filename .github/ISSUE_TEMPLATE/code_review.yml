name: Code Review
description: The final project code review of one student, conducted with a Technical Leader (TL) or the course instructor.
title: "Code Review: Final Project"
body:
  - type: markdown
    attributes:
      value: |
        In a team, each person has their own review about the files they wrote, so open one issue per
        person. Fill it out with the student present, with the project running on their board and a
        whiteboard beside you. Leave a box unchecked when the answer does not show the understanding
        described.
  - type: input
    attributes:
      label: Reviewer
      description: The GitHub username of the TL or instructor conducting this review
      placeholder: your-github-username
    validations:
      required: true
  - type: input
    attributes:
      label: Name of reviewee
      description: The GitHub username of the student being reviewed
      placeholder: their-github-username
    validations:
      required: true
  - type: input
    attributes:
      label: Files the reviewee wrote
      description: The files in src this review is about
      placeholder: src/sensor.py, src/main.py
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: The project on the board
      options:
        - label: The project runs on the board and reads its input and drives its output
  - type: markdown
    attributes:
      value: |
        Start with the class diagram on the whiteboard. **Ask one question per concept below, in your
        own words, about the reviewee's own code**, and have them answer on the whiteboard where the
        question asks for a trace. Vary the question from student to student: the concept stays the
        same, the question does not.

        **Classes and objects**
        - Draw your classes and `main.py`. What does each class remember, and what does it do?
        - Which object does `main.py` give to another object, and why?

        **Methods and self**
        - Trace one method on the whiteboard, with each attribute before and after the call.
        - Pick a method that calls another method with `self`. What is `self` when it runs?

        **Data**
        - What does your list hold? Trace a loop over it with three values.
        - What are the keys and values of your dictionary, and where does a value change?

        **Decisions**
        - Walk through one of your `if` statements with a value exactly at its dividing point.
        - What happens when the input is at its lowest or highest?

        **Hardware**
        - Which pins do your input and output use, and which lines of code read and drive them?
        - What number does your input give, and how does your code turn it into something meaningful?
  - type: checkboxes
    attributes:
      label: Code walkthrough
      description: One point each. Check it when the reviewee's answer showed the understanding described.
      options:
        - label: "Classes and objects: the reviewee can draw their classes and explain what each remembers and does, and how main.py connects them"
        - label: "Methods and self: the reviewee can trace one of their methods on the whiteboard, with the attributes before and after"
        - label: "Data: the reviewee can explain what their list and dictionary hold and trace a loop over one of them"
        - label: "Decisions: the reviewee can explain one of their if statements, including a value at its edge"
        - label: "Hardware: the reviewee can explain how their code reads its input and drives its output"
  - type: textarea
    attributes:
      label: The Good, The Bad, The Ugly
      description: Write a short note with at least 3 aspects done well, and 3 aspects on which the code could be improved
      value: |
        #### Positives
        1.
        2.
        3.
        #### Improvements
        1.
        2.
        3.
    validations:
      required: true
